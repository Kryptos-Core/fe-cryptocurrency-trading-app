<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Charts - Trading View</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
        .overlay-info {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 10;
            pointer-events: none;
            min-width: 200px;
        }
        .overlay-tooltip {
            position: absolute;
            background: rgba(20, 24, 28, 0.9);
            color: #f5f7fa;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            z-index: 11;
            pointer-events: none;
            display: none;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <div class="overlay-info" id="chart-info">
        <div>📊 <span id="pair-name">--</span></div>
        <div>Interval: <span id="interval-info">1m</span> | Candles: <span id="candle-count">0</span></div>
        <div id="volume-info" style="margin-top: 4px; opacity: 0.8;">Vol: --</div>
    </div>

    <script>
        // ============================================================================
        // LIGHTWEIGHT CHARTS INTEGRATION (TradingView)
        // High-performance canvas-based charting for realtime data
        // ============================================================================

        const ChartState = {
            // Chart instances
            chart: null,
            lineSeries: null,
            
            // Data
            candles: new Map(), // Map<timestamp, candle> for efficient updates
            candleArray: [],    // Array for ordering
            
            // Metadata
            pairId: null,
            pairName: '--',
            interval: '1m',
            lastPrice: 0,
            lastCandle: null,
            
            // UI state
            crosshairPrice: null,
            hoveredCandleIndex: null,
        };

        /**
         * Initialize Lightweight Charts
         */
        function initializeChart() {
            const container = document.getElementById('chart-container');

            if (typeof LightweightCharts === 'undefined') {
                const info = document.getElementById('chart-info');
                info.innerHTML = '⚠️ Lightweight Charts failed to load. Check network access or local assets.';
                info.style.background = 'rgba(255, 153, 0, 0.9)';
                info.style.color = '#1c1c1c';
                console.error('LightweightCharts is undefined');
                return;
            }
            
            // Create chart with optimized settings for realtime
            ChartState.chart = LightweightCharts.createChart(container, {
                layout: {
                    textColor: '#333',
                    background: { type: 'solid', color: '#ffffff' },
                    fontSize: 12,
                    fontFamily: "'Segoe UI', sans-serif",
                },
                width: container.clientWidth,
                height: container.clientHeight,
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                    barSpacing: 12,
                    rightOffset: 15,
                    fixRightEdge: true,
                },
                rightPriceScale: {
                    autoScale: true,
                    borderVisible: true,
                    scaleMargins: {
                        top: 0.1,
                        bottom: 0.1,
                    },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: {
                        visible: true,
                        style: 2, // Dotted
                        width: 1,
                        color: 'rgba(32, 38, 46, 0.1)',
                    },
                    horzLine: {
                        visible: true,
                        style: 2,
                        width: 1,
                        color: 'rgba(32, 38, 46, 0.1)',
                    },
                },
            });

            // Create line series
            ChartState.lineSeries = ChartState.chart.addLineSeries({
                color: '#2962ff',
                lineWidth: 2,
                lastPriceAnimation: 1, // LightweightCharts.LastPriceAnimationMode.Continuous
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                if (ChartState.chart && container.parentElement) {
                    ChartState.chart.applyOptions({
                        width: container.clientWidth,
                        height: container.clientHeight,
                    });
                }
            });

            // Handle crosshair movement
            ChartState.chart.subscribeCrosshairMove(handleCrosshairMove);

            console.log('✅ Lightweight Charts initialized');
        }

        /**
         * Handle crosshair move to show price
         */
        function handleCrosshairMove(param) {
            if (!param.time || !param.seriesPrices.size) {
                return;
            }

            const candleSeriesData = param.seriesPrices.get(ChartState.lineSeries);
            if (!candleSeriesData) {
                return;
            }

            const price = candleSeriesData.value || ChartState.lastPrice;
            updatePriceDisplay(price);
        }

        function formatTime(time) {
            if (typeof time === 'number') {
                const date = new Date(time * 1000);
                return date.toLocaleString();
            }
            if (typeof time === 'object' && time.year) {
                const date = new Date(time.year, time.month - 1, time.day);
                return date.toLocaleDateString();
            }
            return '--';
        }

        function intervalToSeconds(interval) {
            switch (interval) {
                case '1m': return 60;
                case '5m': return 300;
                case '15m': return 900;
                case '1h': return 3600;
                case '4h': return 14400;
                case '1d': return 86400;
                default: return 60;
            }
        }

        /**
         * Update price display
         */
        function updatePriceDisplay(price) {
            const priceEl = document.getElementById('price-display');
            if (!priceEl) return;
            const formattedPrice = price.toLocaleString('en-US', {
                minimumFractionDigits: 4,
                maximumFractionDigits: 8,
            });
            priceEl.textContent = formattedPrice;
        }

        /**
         * Add or update a candlestick
         * Called from Flutter for each OHLC event
         */
        function addCandle(candleData) {
            const {
                pair_id,
                interval,
                open_time,
                close_time,
                open,
                high,
                low,
                close,
                volume,
                is_closed,
            } = candleData;

            // Update metadata
            ChartState.pairId = pair_id;
            ChartState.interval = interval;
            ChartState.lastPrice = parseFloat(close);
            ChartState.lastCandle = candleData;

            // Convert ms to seconds (Lightweight Charts uses Unix seconds)
            const timeInSeconds = Math.floor(open_time / 1000);

            const candle = {
                time: timeInSeconds,
                open: parseFloat(open),
                high: parseFloat(high),
                low: parseFloat(low),
                close: parseFloat(close),
            };

            // Store in map for efficient updates
            const existing = ChartState.candles.has(timeInSeconds);
            ChartState.candles.set(timeInSeconds, candle);

            // Rebuild array (keep sorted)
            ChartState.candleArray = Array.from(ChartState.candles.values()).sort(
                (a, b) => a.time - b.time
            );

            // Update chart data
            if (ChartState.lineSeries && ChartState.candleArray.length > 0) {
                const lineData = ChartState.candleArray.map(c => ({
                    time: c.time,
                    value: c.close,
                }));
                ChartState.lineSeries.setData(lineData);

                const markerSource = ChartState.candleArray.length > 200
                    ? ChartState.candleArray.slice(-200)
                    : ChartState.candleArray;

                const markers = markerSource.map(c => ({
                    time: c.time,
                    position: 'inBar',
                    color: 'rgba(41, 98, 255, 0.6)',
                    shape: 'circle',
                    size: 0.5,
                }));
                ChartState.lineSeries.setMarkers(markers);
                
                // Keep latest point aligned to the right
                if (ChartState.chart) {
                    const timeScale = ChartState.chart.timeScale();
                    if (ChartState.candleArray.length === 1) {
                        const intervalSec = intervalToSeconds(ChartState.interval);
                        const t = ChartState.candleArray[0].time;
                        timeScale.setVisibleRange({
                            from: t - intervalSec * 120,
                            to: t + intervalSec * 1,
                        });
                    } else if (timeScale.scrollToRealTime) {
                        timeScale.scrollToRealTime();
                    } else if (!existing) {
                        timeScale.fitContent();
                    }
                }
            }

            // Update UI
            updateChartInfo(is_closed);

            const action = existing ? '📈 Updated' : '📊 New';
            console.log(
                `${action} candle: ${interval} @ ${close} (${is_closed ? '✅ closed' : '🔄 updating'}) - Total: ${ChartState.candleArray.length}`
            );
        }

        /**
         * Update chart info display
         */
        function updateChartInfo(isClosed) {
            document.getElementById('pair-name').textContent = `Pair ${ChartState.pairId}`;
            document.getElementById('interval-info').textContent = ChartState.interval;
            document.getElementById('candle-count').textContent = ChartState.candleArray.length;
            
            const volEl = document.getElementById('volume-info');
            if (ChartState.lastCandle?.volume) {
                volEl.textContent = `Vol: ${parseFloat(ChartState.lastCandle.volume).toLocaleString()}`;
            }

            // Update price display with status
            const statusIcon = isClosed ? '✅' : '🔄';
            const priceEl = document.getElementById('price-display');
            if (priceEl) {
                const formattedPrice = ChartState.lastPrice.toLocaleString('en-US', {
                    minimumFractionDigits: 4,
                    maximumFractionDigits: 8,
                });
                priceEl.innerHTML = `${formattedPrice}<br><span style="font-size: 10px; opacity: 0.7;">${statusIcon}</span>`;
            }
        }

        /**
         * Clear all data
         */
        function clearChart() {
            ChartState.candles.clear();
            ChartState.candleArray = [];
            if (ChartState.lineSeries) {
                ChartState.lineSeries.setData([]);
            }
            console.log('🗑️ Chart cleared');
        }

        /**
         * Export API for Flutter communication
         */
        window.LWChartAPI = {
            addCandle,
            clearChart,
            getState: () => ({ ...ChartState }),
            isReady: () => ChartState.chart !== null,
        };

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeChart);
        } else {
            initializeChart();
        }

        console.log('✅ Lightweight Charts API ready');
    </script>
</body>
</html>
