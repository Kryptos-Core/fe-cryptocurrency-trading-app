name: crypto_trading_app
description: A Flutter app for cryptocurrency trading.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  equatable: ^2.0.5
  
  # Networking
  dio: ^5.4.0
  # retrofit: ^4.0.3  # Commented out - not used
  json_annotation: ^4.8.1
  
  # Charts & Visualization (Lightweight Charts via WebView)
  webview_windows: ^0.4.0
  
  # WebSocket & Realtime (Socket.IO)
  socket_io_client: ^2.0.2
  socket_io_common: ^2.0.0
  
  # Performance & Utilities
  vector_math: ^2.1.4
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Utilities
  intl: ^0.20.2
  get_it: ^7.6.4
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  logger: ^2.0.2+1
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.6
  # retrofit_generator: ^8.0.4  # Commented out - not used, conflicts with hive_generator
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lightweight_chart.html
    - .env